# PTP chain: raw frames between two CoreBoards, stamped by the MAC. See README.rst.
CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_PHY_ONLY=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_THREAD_NAME=y
# The stats thread fits lines in doubles
CONFIG_FPU_SHARING=y

# Ethernet only: the link comes up with the L2
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
# INF: the driver logs the PTP clock rate and sub-second increment at boot
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_PHY_LOG_LEVEL_WRN=y
CONFIG_MDIO_LOG_LEVEL_WRN=y
CONFIG_MDIO=y
# The stack needs one protocol (net_pkt.c); IPv4 without DHCP or addresses is idle
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_ALIGNMENT=64
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_DWMAC_NB_RX_DESCS=16
CONFIG_DWMAC_NB_TX_DESCS=16

# The MAC's hardware clock stamps every frame (a custom EtherType needs ALL). Digital rollover
# (the only mode): the sub-second field is in ns; chain_math.h also converts binary.
CONFIG_PTP_CLOCK=y
CONFIG_PTP_CLOCK_DWC_MAC_RX_TIMESTAMP_ALL=y
CONFIG_PTP_CLOCK_DWC_MAC_FINE_SSINC=y

CONFIG_ETH_DWMAC_RX_FAST=y
CONFIG_ETH_DWMAC_TX_FAST=y
CONFIG_ETH_DWMAC_TX_RAMFUNC=y
# Every frame is stamped: one completion interrupt each
CONFIG_ETH_DWMAC_TX_IRQ_EVERY=1

# Everything of the chain runs on CPU 0: the EMAC interrupt, the hook, the burst timer and the stats
# thread (pinned in src/stats.c). CPU 1 stays idle.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_IPI_OPTIMIZE=y

# Burst timer in 100 us ticks (the default interval is 7812 us)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Die temperature in the window lines (coretemp, enabled in the board overlay)
CONFIG_SENSOR=y
# Register peeks from the shell (devmem), for the PPS registers
CONFIG_DEVMEM_SHELL=y
