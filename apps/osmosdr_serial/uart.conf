#
# The WHY2025 badge's C6 on its UART link (-DEXTRA_CONF_FILE=uart.conf): UART0 to the P4 at
# 5 Mbaud (the overlay's esdr,link-uart, up to 250 kS/s) instead of SDIO, and the image as it
# was before the gapless receiver, which needs SDIO: the Wi-Fi driver brings the radio up
# (prj.conf). Undoes the board configuration's SDIO and gapless lines.
CONFIG_APP_LINK_SDIO=n
CONFIG_ESP_SDR_GAPLESS=n
CONFIG_ESP_SDR_PHY_ONLY=n
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_MAIN_STACK_SIZE=1536
