#
# The MCH2022 badge's ESP32: the protocol on UART0, which the badge's RP2040 bridges to its
# first USB serial port (the overlay's esdr,link-uart); no console. Receive only, in decimated
# bursts (no paced receiver on the ESP32).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_ESP_SDR_RX_DECIM=y
# The capture bank is SRAM1, where .noinit would spill otherwise.
CONFIG_ESP32_REGION_1_NOINIT=n
# The RP2040 driver clears the download reset lock, so esptool can always reach the ESP32.
CONFIG_I2C=y
CONFIG_MFD=y
