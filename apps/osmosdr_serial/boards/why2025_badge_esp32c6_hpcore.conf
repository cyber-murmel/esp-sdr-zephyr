#
# The ESP32-P4 reaches the radio over SDIO (up to 2 MS/s); with this and ESP_SDR_GAPLESS off,
# over UART0 at 5 Mbaud (the overlay's esdr,link-uart, up to 250 kS/s), the fallback link.
CONFIG_APP_LINK_SDIO=y

# ESDR_MODE_GAPLESS (as gapless.conf): the whole 80 MS/s without a gap, pruned to what the
# link carries (esp_sdr_gapless.h). The ring takes SRAM blocks 1 and 2, so the image must fit
# block 0: the radio comes up without the Wi-Fi driver.
CONFIG_WIFI=n
CONFIG_NETWORKING=n
CONFIG_ESP_SDR_PHY_ONLY=y
CONFIG_ESP_SDR_GAPLESS=y
# Block 3 holds the staging ring and the stream's blocks (40 KiB with the bounce buffers).
CONFIG_ESP_SDR_GAPLESS_STAGE_KB=64
# The PHY comes up (and calibrates, printing through its own printf) in main(), not in the
# Wi-Fi driver's thread: 1536 bytes overflowed.
CONFIG_MAIN_STACK_SIZE=4096
