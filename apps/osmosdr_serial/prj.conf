# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
# The driver's and the IP stack's options (no power save, minimal, no IP traffic) are defaults
# in the app's Kconfig: lines here would warn in the gapless image, which has neither.

CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_RX_DECIM=n

# USB-Serial-JTAG carries the protocol; the console goes to UART0 (boards/). No logging: the
# C5's RAM below its capture bank is tight.
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=1536
