CONFIG_ZIGBEE_ZNP=y
CONFIG_ENTROPY_GENERATOR=y

# The host link is USB-Serial-JTAG (interrupt driven, boards/); the console is UART0.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# NV items survive resets in the storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_HWINFO=y

# The radio driver's frames are net_pkts; no IP on top.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_NET_BUF_DATA_SIZE=128

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_MAIN_STACK_SIZE=3072
