# The radio: no Wi-Fi driver, the ring through the diagnostic bus.
CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_PHY_ONLY=y
CONFIG_ESP_SDR_DIAG16=y
CONFIG_ESP_SDR_RX_DECIM=n
CONFIG_LIBVRT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
# main only starts the threads (the radio's own thread has the 4096 the radio start needs)
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_NAME=y

# Ethernet: YT8531 on RGMII, the driver is the fork's DWC MAC. Gigabit, 125 MHz reference clock.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETHERNET_LOG_LEVEL_WRN=y
CONFIG_PHY_LOG_LEVEL_WRN=y
CONFIG_MDIO_LOG_LEVEL_WRN=y
CONFIG_MDIO=y
CONFIG_ETH_DWMAC_TX_FAST=y
# the DMA needs cache line sized and aligned buffers (64 byte lines)
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_ALIGNMENT=64
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_DWMAC_NB_TX_DESCS=64
CONFIG_DWMAC_NB_RX_DESCS=8

# Addresses: DHCPv4, IPv6 link-local and autoconfiguration. The control path of the stack is
# only that; the data packets do not go through it.
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_NET_IPV6_ND=y
# the ULA prefix as well as the link-local and the GUA: the default is 2
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=5

# The ring consumer (main, priority 0) and the sender (1) must not wait for a cooperative thread: the
# system work queue (PHY link monitor, every 500 ms) and the network threads run preemptible below them.
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=7
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
# the network threads below the sender (1) and the ring consumer (0)
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_TX_THREAD_BASE_PRIO=8
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=8
CONFIG_NET_IF_IPV6_PREFIX_COUNT=3
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
CONFIG_NET_CONFIG_INIT_TIMEOUT=10
CONFIG_NET_SHELL=y
# net stats: the MMC counters with CONFIG_NET_STATISTICS_ETHERNET_VENDOR
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_STATISTICS_ETHERNET_VENDOR=y

# Stacks (the 800 byte default of the event thread overflowed with immediate logging)
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# SMP is on below (onecore.conf turns it off).

# SMP, the ring consumer on CPU 0 and the sender on CPU 1: 20 times fewer losses than one core at
# 40 MS/s IPv4 on the board (4 against 85 to 92 packets in 30 s). onecore.conf is the old build.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

# Several threads use float (gain and frequency in commands and contexts) and preempt each other.
CONFIG_FPU_SHARING=y
