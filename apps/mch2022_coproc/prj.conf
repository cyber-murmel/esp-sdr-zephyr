CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_HWINFO=y
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HWINFO_DEVID_LENGTH=16
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_BUF_POOL_SIZE=2048
# Two packets ready on bulk IN: one a time reaches some 600 kB/s.
CONFIG_UDC_RPI_PICO_DOUBLE_BUFFER_BULK_IN=y
CONFIG_UDC_BUF_COUNT=32

# No console: the firmware's log is read over USB (COPROC_REQ_GET_LOG, fwlog.c).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_ISR_STACK_SIZE=1024

CONFIG_REBOOT=y
CONFIG_WATCHDOG=y
