# The radio: no Wi-Fi driver, the ring through the diagnostic bus.
CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_PHY_ONLY=y
CONFIG_ESP_SDR_DIAG16=y
CONFIG_ESP_SDR_RX_DECIM=n

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR osmosdr HS"
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_THREAD_STACK_SIZE=4096

CONFIG_LOG=y
# The PHY comes up (and calibrates) in main().
CONFIG_MAIN_STACK_SIZE=4096
