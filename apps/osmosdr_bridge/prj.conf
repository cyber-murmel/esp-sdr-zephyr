#
# The ESP32-P4 as a USB 2.0 high-speed bridge to its ESP32-C6 radio over SDIO.

CONFIG_GPIO=y
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR osmosdr bridge"
# Same PID as the other apps (host udev rules, the Soapy module); told apart by the interface.
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
# Vendor requests wait for the radio's reply over SDIO in the USB thread.
CONFIG_USBD_THREAD_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
# The SDIO reader polls the radio's byte counter; idle, it sleeps a tick (100 us).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
