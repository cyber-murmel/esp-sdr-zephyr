#
# The SoC turns the FPU on without sharing: the channelizer thread and the shell (its float
# stats) would clobber each other's float registers. Lazy switching (Zephyr decodes the
# trapping instruction from mtval, which the P4 fills).
CONFIG_FPU_SHARING=y
