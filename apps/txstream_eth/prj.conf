# The transmit stream: the DAC by two-group flips, a tone from the injector, Ethernet up.
# Memory layout and network buffers as apps/rxbench/txmem.conf.
CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_PHY_ONLY=y
CONFIG_ESP_SDR_REPLAY=y
CONFIG_ESP_SDR_RX_DECIM=n
CONFIG_ESP_SDR_S31_TXMEM=y
CONFIG_ESP_SDR_TXS_PIE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# 512 B: the buffer is in group 0 (BSS), where the IPI and per-CPU run queue code of PIN_ONLY and the PSRAM driver's
# code took the room
CONFIG_LOG_BUFFER_SIZE=512
# The main thread is the stream's control thread: chain on and off (PHY), the report
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
# The injector runs at the lowest priority: the shell is one above it
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=13
# A stack overflow is caught at the next context switch (a word per thread)
CONFIG_STACK_SENTINEL=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_FPU_SHARING=y

# The deadman's timer
CONFIG_COUNTER=y

# PSRAM (16 MB octal on the CoreBoard) at 250 MHz, the MPLL at 500 MHz (esp_psram_impl_ap_oct.c sets the PLL for
# this speed; at 400 MHz, SPIRAM_SPEED_200M, the PLL-derived clocks would change). The stacks of the threads with
# slack and cold data go there, the rest stays in internal RAM: lib/esp_sdr/esp_sdr_txmem_s31.ld, place.h, README.
# main() logs the PLL-derived clocks once (tx_boot.c). CPU 1 never touches PSRAM.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_250M=y

# Ethernet: YT8531 on RGMII, the fork's DWC MAC, gigabit.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETHERNET_LOG_LEVEL_WRN=y
CONFIG_PHY_LOG_LEVEL_WRN=y
CONFIG_MDIO_LOG_LEVEL_WRN=y
CONFIG_MDIO=y
CONFIG_ETH_DWMAC_RX_FAST=y
CONFIG_ETH_DWMAC_TX_RAMFUNC=y
# the status and the replies go out as prepared frames (dwmac_send_frames), not through the stack
CONFIG_ETH_DWMAC_TX_FAST=y
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_ALIGNMENT=64
# 43 receive buffers of 1664 B in group 3: 16 with the MAC, TX_HOLD = 25 (src/tx_hold.h) for the stream, 2 for the
# stack (tx_stream.c checks). The stacks of the threads with slack in PSRAM (above) freed the room (9 buffers, 224 B
# left in group 3: the linker stops the build when a buffer more does not fit).
CONFIG_DWMAC_NB_RX_DESCS=16
CONFIG_NET_BUF_RX_COUNT=43
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_DWMAC_NB_TX_DESCS=16

# DHCPv4, IPv6 link-local and autoconfiguration; answers ping and neighbour requests.
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=5
CONFIG_NET_IF_IPV6_PREFIX_COUNT=3
# The tables of the stack, sized for one host, one router and the DHCP server (group 0 has no room to spare: the PSRAM
# driver's code and data are in it)
CONFIG_NET_MAX_ROUTES=2
CONFIG_NET_IPV4_MAX_ROUTES=2
CONFIG_NET_IPV6_MAX_NEIGHBORS=4
CONFIG_NET_IPV4_MAX_NEIGHBORS=2
CONFIG_NET_MAX_CONN=5
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
CONFIG_NET_CONFIG_INIT_TIMEOUT=10
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_STATISTICS_ETHERNET_VENDOR=y

CONFIG_SYSTEM_WORKQUEUE_PRIORITY=7
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_TX_THREAD_BASE_PRIO=8
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=8
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# The network and every device interrupt on CPU 0, the stream's flips alone on CPU 1.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
# Every thread starts on CPU 0 alone (the network, the shell, the log, the status and control threads, main); the
# flip thread is pinned to CPU 1 before it starts (tx_stream.c). A wakeup then never sends CPU 1 a scheduler
# interrupt: with IPI_OPTIMIZE only the CPUs a thread may run on, and where it would preempt, are interrupted.
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_IPI_OPTIMIZE=y

# The status thread sleeps a tick at a time (src/tx_net.c): 100 us
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
