# The injector (tx tone, tx inject: sample packets made on the board, no host needed) next to the network
# side. Its 2.4 KB do not fit group 3 with the 43 receive buffers: two fewer (3.3 KB) make room. The
# injector holds TX_BUFFERS = 21 of the 41 and the MAC 16, which leaves 4 for the stack: for a bench without a
# host, not for the network run (op_start refuses a run from the network in this build).
#   west build ... -- -DEXTRA_CONF_FILE=injector.conf
CONFIG_APP_TXS_INJECT=y
CONFIG_NET_BUF_RX_COUNT=41
