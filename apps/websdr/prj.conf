# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y

CONFIG_ESP_SDR=y

# The protocol's serial port (chosen esp-sdr,websdr-uart), interrupt driven.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# The DATA payload checksum (crc32_ieee()).
CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=2048
