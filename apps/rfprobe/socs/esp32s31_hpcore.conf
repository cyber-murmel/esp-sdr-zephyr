# The S31's radio runs without the Wi-Fi driver.
CONFIG_WIFI=n
CONFIG_NETWORKING=n
CONFIG_ESP_SDR_PHY_ONLY=y
# The PHY comes up (and calibrates) in main(), not in the Wi-Fi driver's thread.
CONFIG_MAIN_STACK_SIZE=4096
# "probe ring": the gapless ring through the diagnostic bus.
CONFIG_ESP_SDR_DIAG16=y
# "probe tx replay" and "tx paint": the DAC engine, in the ring's group.
CONFIG_ESP_SDR_REPLAY=y
