# The RF switch to the U.FL coax port instead of the chip antenna.
CONFIG_WAVESHARE_ESP32C5_ZERO_EXT_ANTENNA=y

# Gapless ring through the modem diagnostic bus: probe diag.
CONFIG_ESP_SDR_DIAG=y

# Loop replay through the DAC engine: probe tx.
CONFIG_ESP_SDR_REPLAY=y

# The die temperature (probe temp): the sensor, which calstore.conf brings elsewhere (not
# taken here: no SRAM for the settings volume, see CMakeLists.txt).
CONFIG_SENSOR=y
# No SRAM for the LTE calibration's work memory either: no "probe cal lte" (cal show/set
# still work, without a store), and the shell stack stays the plain one.
CONFIG_ESP_SDR_LTE_CAL=n
CONFIG_SHELL_STACK_SIZE=3072
