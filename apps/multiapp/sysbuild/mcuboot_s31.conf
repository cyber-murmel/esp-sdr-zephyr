# MCUboot on the ESP32-S31 must fit its 56 KB partition (partitions_s31.dtsi). Verifying ED25519
# (the project's signing key, apps/common/sysbuild/Kconfig.signing) costs 10 KB over RSA-2048: 61904
# bytes with the defaults, 55856 with what follows (limit 57344). Not needed for a loader that boots
# a signed image: its log and printk (no output at all), the GPIO driver (about 2 KB with the
# interrupt allocation it pulls in), the ASN.1 parse of the public key (the key is a 32 byte tail),
# and the prologue copies of every function.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_GPIO=n
CONFIG_BOOT_KEY_IMPORT_BYPASS_ASN=y
CONFIG_RISCV_USE_MSAVE_RESTORE=y
