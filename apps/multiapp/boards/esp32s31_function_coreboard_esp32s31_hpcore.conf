# The ESP32-S31-Function-CoreBoard-1 boots into osmosdr_hs, the SDR on its USB HS port, also after a
# power cycle; the shell's "multiapp run <name>" starts another app until the next reset. A bad
# file falls back to the built-in copy, else to a boot without an app, with the drive.
CONFIG_MULTIAPP_AUTOSTART="osmosdr_hs"
