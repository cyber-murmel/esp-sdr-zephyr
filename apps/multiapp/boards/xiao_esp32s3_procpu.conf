# The XIAO ESP32S3 with its display, knob and SD card: MicroPython with LVGL (micropython.cmake), whose
# drivers are in its extension. What the host keeps for it:
CONFIG_MULTIAPP_MICROPYTHON_GUI=y
# Boots to MicroPython's launcher (the apps on the panel, the knob picks), as the Communicator does,
# also after a power cycle; the shell's "multiapp run <name>" (esdr.shell() from the REPL) starts
# another app. A bad file falls back to a boot without an app, with the drive.
CONFIG_MULTIAPP_AUTOSTART="micropython"
# On by default with the nodes in the devicetree, and SPI with it: only in the extension.
CONFIG_DISK_DRIVER_SDMMC=n
# Two USB drives: the volume and the SD card, which it may hold in exFAT.
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=2
CONFIG_FS_FATFS_EXFAT=y
# The SD card path (disk, SD stack, SPI driver) is deeper than the flash disk's.
CONFIG_USBD_MSC_STACK_SIZE=1728
