# The Hackaday Communicator with its display and keyboard: MicroPython with LVGL (micropython.cmake), whose
# drivers are in its extension.
CONFIG_MULTIAPP_MICROPYTHON_GUI=y
# Comes up as the badge it is: the launcher on the panel, also after a power cycle. A bad file falls back to a
# boot without an app, with the drive.
CONFIG_MULTIAPP_AUTOSTART="micropython"
