# multiapp on the ESP32-S31: one core, as its apps run; the extensions' code and data in octal
# PSRAM, where code runs at the address it is written at (src/apps.c). The network stack comes
# with the CoreBoard's Ethernet (../common/net/net.conf, added by sysbuild.cmake and setting
# NETWORKING=y after this file): without it (no sysbuild) there is none; no app of this chip
# streams over CDC-NCM, and the Wi-Fi driver is not built for it.
CONFIG_NETWORKING=n
CONFIG_FPU=y
# k_current_get() a call, not a thread-local variable: llext relocates no TLS access.
CONFIG_CURRENT_THREAD_USE_TLS=n
CONFIG_ESP_SPIRAM=y
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
# Peak 2224 of 4096 seen on the board with the network stack; 3072 leaves 38 %.
CONFIG_HEAP_MEM_POOL_SIZE=3072
# Peak 1312 of 4096 seen on the board; the net shell commands need some more.
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_RESET_ON_FATAL_ERROR=y
# A hung app resets the board instead of needing a replug; "multiapp crash" tells.
CONFIG_APP_LIVENESS_WATCHDOG=y

# USB device on the OTG HS port: shell on CDC-ACM, DFU with sysbuild/MCUboot, the drive in boots
# without an app, osmosdr_hs's stream. The console and the log stay on UART0.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR multiapp"
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_CLASS=y
# CDC-ACM carries the shell: its own logging must stay off (doc/dev/testing.md).
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=256
# The log, printk with it, on UART0 as well as in the shell: off by default with a serial shell.
CONFIG_LOG_BACKEND_UART=y
# Peak 720 with the UART backend.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_HWINFO=y
# As osmosdr_hs's own: its SET_CAL writes the calibration settings on the USB thread.
CONFIG_USBD_THREAD_STACK_SIZE=4096
# As osmosdr_hs's own: the PHY comes up and calibrates on main's stack as the radio loads.
CONFIG_MAIN_STACK_SIZE=4096

# The radio as osmosdr_hs uses it: the gapless ring through the diagnostic bus, which takes TCM
# group 2 (the image must end below 0x2F040000); rfprobe's DAC engine in the same group.
CONFIG_ESP_SDR_DIAG16=y
CONFIG_ESP_SDR_REPLAY=y
# The internal RAM of the INTERNAL extensions in group 0 (src/apps.c): the radio module's IRAM_ATTR
# code, data and bss (9.2 KB) and, in a boot that has not lent it out, the fast kernels of an app
# (rfprobe's hot swap holds an old and a new one). osmosdr_hs, whose data and bss are 104 KB of
# USB batches, lives in TCM group 3 instead (BANK2, src/bank2.h): 107 KB of the 110.5 KB there.
CONFIG_MULTIAPP_MODULE_HEAP_SIZE=16384

# osmosdr_hs's crystal calibration (esp_sdr_calstore.c): settings on ZMS in a partition of its own,
# "calibration" (boards/partitions_s31.dtsi, chosen as zephyr,settings-partition in the overlay),
# with the die temperature. The device never writes the FAT volume, which the PC may have as a
# USB drive.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_DISK_ACCESS=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_ESP_SDR_CALSTORE=y
CONFIG_SENSOR=y
# osmosdr_hs's USB: the host's device, its messages passed on (ext/usbd_prelude.h).
CONFIG_APP_USB_MSG_HOOK=y

# The apps as files on a FAT volume (src/drive.c), read by the host before USB starts; long names
# (".llext" is not 8.3).
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_NUM_FILES=4
CONFIG_FS_FATFS_NUM_DIRS=2
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FLASHDISK_LOG_LEVEL_WRN=y
CONFIG_FS_LOG_LEVEL_WRN=y
# The app files' CRC (crc32_ieee()).
CONFIG_CRC=y
# The volume as a USB drive in boots without an app.
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_DOUBLE_BUFFERING=n
CONFIG_USBD_MSC_STACK_SIZE=1152
CONFIG_USBD_MSC_LOG_LEVEL_WRN=y

# A network update boots on trial: reset, DHCP, `mcumgr arm` on the shell and `west mcumgr confirm` by hand
# (the gate closes at every reset; measured 10 to 25 s by hand). The shared default is 60 (apps/common/Kconfig);
# this host's is 120.
CONFIG_APP_TRIAL_TIMEOUT_S=120
