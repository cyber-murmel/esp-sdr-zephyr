# The stock Wi-Fi driver as a module (wifi.cmake): the second Kconfig pass's fragment. The host has
# what the driver needs from the network stack and the kernel (CONFIG_MULTIAPP_WIFI).
CONFIG_WIFI_ESP32=y
# Its buffers in PSRAM, as any image of this kind.
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=2
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8
CONFIG_ESP32_WIFI_EVENT_TASK_STACK_SIZE=1536
# The blob wants its task and the WMAC interrupt on one core: core 0 (the Kconfig default), where the
# host reserves the interrupt too (CMakeLists.txt). Core 1 is the SDR's in a coex boot: its worker
# and ring run there, and a Wi-Fi task pinned to it starved while holding a blob lock.
CONFIG_ESP32_WIFI_TASK_PINNED_TO_CORE_0=y
