# The Kconfig values of the micropython app the host lacks (extconfig.py). As apps/micropython/prj.conf.
CONFIG_MICROPYTHON=y
CONFIG_MICROPY_CONFIGFILE="mpconfigport_multiapp.h"
CONFIG_MICROPY_FROZEN_MODULES=y
CONFIG_MICROPY_CONFIG_ROM_LEVEL_EXTRA_FEATURES=y
CONFIG_MICROPY_HEAP_SIZE=512
# The port's zsensor module includes the sensor API; no sensor, no code.
CONFIG_SENSOR=y
# Only for the prototypes the port's src/zephyr_getchar.c calls: mp_glue.c has the functions.
CONFIG_CONSOLE_HANDLER=y
CONFIG_UART_CONSOLE_DEBUG_SERVER_HOOKS=y
# esdr.shell() on a shell of its own, in PSRAM (the host's has handed the port over). What it runs
# may print a lot ("multiapp info"), and it must not become a log backend: the host's list of them
# cannot take one.
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048
CONFIG_SHELL_DUMMY_INIT_LOG_LEVEL_NONE=y
# The port's machine_spi.c still uses SPI_OP_MODE_MASTER, whose deprecation warning -Werror (twister,
# CI) makes fatal.
CONFIG_WARN_DEPRECATED=n
