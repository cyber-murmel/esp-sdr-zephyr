# The Kconfig values of the micropython app with a display (extconfig.py), as in
# apps/micropython/socs/esp32s3_procpu.conf.
CONFIG_SPI=y
CONFIG_DISPLAY=y
# Callbacks in the drivers' context, no input thread.
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
# LVGL allocates from the Python heap, its rendering buffers too, and MicroPython runs its timers.
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_MICROPYTHON=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_DEF_REFR_PERIOD=20
