#
# On top of micropython.conf, for the ESP32-S31 (micropython.cmake). The port's stdio hook lets
# mp_repl_s31.c move the REPL onto an SSH channel.
CONFIG_MICROPY_STDIO_HOOK=y
# The Python heap is PSRAM (mp_glue.c adds what the boot leaves); the port's own is a token.
CONFIG_MICROPY_HEAP_SIZE=512
