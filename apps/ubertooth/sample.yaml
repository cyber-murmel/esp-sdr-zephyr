sample:
  name: ESP-SDR Ubertooth
  description: >-
    Ubertooth One device firmware on the ESP32-S3 SDR: the USB protocol of the
    upstream host tools (ubertooth-util, -specan, -btle, ...)
common:
  tags: esp-sdr
  sysbuild: true
  platform_allow:
    - xiao_esp32s3/esp32s3/procpu
    - communicator_badge/esp32s3/procpu
  integration_platforms:
    - xiao_esp32s3/esp32s3/procpu
tests:
  # Needs a board and the upstream host tools: see the README.
  sample.esp_sdr.ubertooth:
    build_only: true
  # The ring's profile of CPU 0 (esp_sdr_prof.h, the "prof" shell command).
  sample.esp_sdr.ubertooth.prof:
    build_only: true
    platform_allow:
      - xiao_esp32s3/esp32s3/procpu
    extra_args:
      - ubertooth_CONFIG_ESP_SDR_CPU_PROF=y
