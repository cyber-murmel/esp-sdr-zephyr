# The radio without the Wi-Fi driver (lib/esp_sdr brings the PHY up), so no network stack. On the
# XIAO, following at gain 40 three rounds each (2026-11-13), the stream lost 0.0020 % against
# 0.0021 % with the driver, at the same noise floor and demodulator cycles; the internal RAM below
# the banks has 30 KB more room and the flash code is 267 KB smaller.
CONFIG_WIFI=n
CONFIG_ESP_SDR_PHY_ONLY=y

CONFIG_ESP_SDR=y
# Continuous receive: three dump banks, so the DRAM image ends below 0x3fcb0000.
CONFIG_ESP_SDR_RING=y
CONFIG_ESP_SDR_RING_BOX4=y
# The two-stage FIR is never used (box4 only): 2.9 KB of high RAM and some IRAM back.
CONFIG_ESP_SDR_RING_FIR=n
CONFIG_ESP_SDR_RX_DECIM=n
# Transmit: the DAC stream (gapless generator playback), buffers above the capture bank.
CONFIG_ESP_SDR_TX=y
CONFIG_ESP_SDR_TX_DAC_HIGH_RAM=y
# CPU 0's hottest flash code as one block at a fixed instruction cache position (hot_text_s3.ld).
CONFIG_ESP_SDR_HOT_TEXT=y
# The BLE modes' clip guard (ubt rx gain guard).
CONFIG_ESP_SDR_GAIN_GUARD=y

# Minimal logging prints at once through printk: no logging thread, no message buffer (internal RAM
# below the ring banks is full; the app logs only from threads, never from the ring).
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
# The PHY calibrates on main's stack (esp_sdr_init(); multiapp measured 1904 bytes).
CONFIG_MAIN_STACK_SIZE=2432
CONFIG_ISR_STACK_SIZE=1024

CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y

# USB device on the OTG port: the Ubertooth vendor interface first, the shell on CDC-ACM and
# DFU with sysbuild/MCUboot behind it (src/ubt_usb.c orders them).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR Ubertooth One"
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_DWC2_STACK_SIZE=1280
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_STACK_SIZE=2560
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_HISTORY=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_DEVMEM_SHELL=y

CONFIG_HWINFO=y
CONFIG_GPIO=y
CONFIG_REBOOT=y

# Internal RAM: three 64 KiB dump banks must fit; the 8 MB octal PSRAM holds the captures.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
# The system heap peaked at 2212 bytes (kernel heap after three following runs, 2026-11-13).
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYS_HEAP_RUNTIME_STATS=y

CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_APP_LIVENESS_WATCHDOG=y
