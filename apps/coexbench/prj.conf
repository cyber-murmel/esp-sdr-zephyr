#
# Wi-Fi driver (station, DHCP, net and wifi shell) plus lib/esp_sdr sharing the radio with it.

CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_WIFI_LOG_LEVEL_ERR=y

# Wi-Fi keeps its power save, mode and channel: the SDR only samples (esp_sdr_rx_set_passive()).
CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_WIFI_SHARED=y
# The radio arbiter: coex sdr takes the radio in Wi-Fi's sleep windows, captures need a claim.
CONFIG_ESP_SDR_ARB=y

CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
