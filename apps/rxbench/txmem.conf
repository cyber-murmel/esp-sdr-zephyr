# The receive bench in the transmit image's memory layout (TCM groups 1 and 2 untouched, the image in
# group 0, buffers and stacks in group 3): west build ... -- -DEXTRA_CONF_FILE=txmem.conf
# (path relative to this app). Nothing is dropped from prj.conf.
CONFIG_ESP_SDR_S31_TXMEM=y

# 34 receive buffers of 1664 B (1536 + the 128 B net_buf): the MAC holds 15 (16 descriptors), the
# app's ring 16, the stack the rest. The build checks the sum. Alternative with a shallower ring:
# CONFIG_APP_RXB_RING=8 and CONFIG_APP_RXB_STACK_HEADROOM=10.
CONFIG_DWMAC_NB_RX_DESCS=16
CONFIG_NET_BUF_RX_COUNT=34
CONFIG_APP_RXB_RING=16
CONFIG_APP_RXB_STACK_HEADROOM=2
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
