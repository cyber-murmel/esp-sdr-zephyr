# Network host for the ESP32-S31 CoreBoard (apps/multiapp, phase 1 of doc/dev/network-services.md):
# Ethernet, addresses and a name, as the base for SSH, MCUmgr and file transfer. A control plane,
# not a stream: the buffer counts are small. apps/stream_eth has the stream's recipe.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETHERNET_LOG_LEVEL_WRN=y
CONFIG_PHY_LOG_LEVEL_WRN=y
CONFIG_MDIO_LOG_LEVEL_WRN=y
CONFIG_MDIO=y

# The MAC's DMA needs cache line sized and aligned buffers (64 byte lines).
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_ALIGNMENT=64
# Packets and buffers for a control plane: a TCP window or two, an SSH session, MCUmgr chunks.
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=7
CONFIG_NET_BUF_TX_COUNT=3
# The MAC keeps its RX descriptors filled from the RX pool: fewer descriptors than RX buffers.
CONFIG_DWMAC_NB_RX_DESCS=4
CONFIG_DWMAC_NB_TX_DESCS=4

# Addresses: DHCPv4, IPv6 link-local and SLAAC with neighbor discovery. No static address.
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_NBR_CACHE=y
# Link-local, GUA and ULA: the default is 2.
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=5
CONFIG_NET_IF_IPV6_PREFIX_COUNT=3
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
# Do not hold the boot for a lease: an app starts either way.
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# The name "esdr" with the whole MAC appended in hex ("esdr0123456789ab", 12 digits), which mDNS
# announces as <name>.local.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="esdr"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_NET_IPV4_IGMP=y
CONFIG_NET_IPV6_MLD=y

CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y

# The slabs and tables below are internal RAM (a slab's free list is built before PSRAM works):
# sized for a few connections (SSH, MCUmgr, mDNS) and a LAN of a few neighbors.
# A connection handler per bound UDP/TCP port and family: DHCPv4, mDNS v4/v6, MCUmgr v4/v6, SSH v4/v6
# and their TCP children (too few: bind fails with -ENOENT, seen with MCUmgr on the board).
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_IPV6_MAX_NEIGHBORS=4
CONFIG_NET_IPV6_MAX_ROUTES=2
CONFIG_NET_IPV6_MAX_NEXTHOPS=2

# The network threads below the radio, the apps (priority 0 and 1) and the USB threads (8, they run
# osmosdr_hs's stream): preemptible at 10, the TCP worker at 10 (default 2) and the MAC's refill
# thread at 9 (default 0). The system work queue keeps its default (cooperative -1): it feeds the
# liveness watchdog (apps/common/src/app_usb.c) and runs osmosdr_hs's link and suspend work, so
# DHCP, mDNS and the PHY link monitor, which run on it, are short.
CONFIG_NET_TCP_WORKER_PRIO=10
CONFIG_ETH_DWMAC_RX_REFILL_THREAD_PRIORITY=9
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_TX_THREAD_BASE_PRIO=10
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=10
# Peaks on the board: net_mgmt 336 of 3072, rx 1080 of 4096, sockets service 1096 of 1536, system
# work queue 1016 of 1024 (DHCP, mDNS and net_config run there: now 2048).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=2048
# Headroom for stacks with no peak measured in this layout: the TCP work queue 1024, the socket service
# 1536 (71 % seen) and the connection monitor 512.
CONFIG_NET_TCP_WORKQ_STACK_SIZE=1536
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2048
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024
CONFIG_NET_TX_STACK_SIZE=4096
