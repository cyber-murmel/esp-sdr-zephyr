# SSH server for the ESP32-S31 CoreBoard's multiapp host (apps/multiapp, phase 3 of doc/dev/network-services.md):
# public key login only (ssh-ed25519, ecdsa-sha2-nistp256), an ECDSA P-256 host key, the Zephyr shell (or a
# registered REPL) on the session. Added after mcumgr.conf by sysbuild.cmake. src/sshd.c makes the host key with the
# hardware TRNG on the first boot and keeps it in the settings; src/console_mux.c is the session's console.
CONFIG_SSH_SERVER=y
CONFIG_SSH_PORT=22
# One connection, one channel: each connection is 10.5 KB of internal RAM (a 4 KB key exchange heap and two 2 KB
# packet buffers, fixed in ssh_transport.h), so a second one would take what the libc arena of the apps needs. The
# host key is slot 0 and the users' keys are slots 1 to 6 of the server's key table (ssh_keygen.h).
CONFIG_SSH_SERVER_MAX_CLIENTS=1
CONFIG_SSH_MAX_CHANNELS=1
CONFIG_SSH_MAX_HOST_KEYS=7
# Clients that come while the connection is taken wait in the listen backlog (the server accepts none then). Each of
# them takes a network context and a connection handler: net.conf's 8 and 10 are 2 short.
CONFIG_SSH_SERVER_LISTEN_BACKLOG=2
# A connection that sends nothing must not keep the only slot: closed 30 s after it was accepted if it has not logged
# in. A client that vanished is noticed by TCP keep-alive (30 s idle, 3 probes 10 s apart).
CONFIG_SSH_SERVER_LOGIN_GRACE_TIME=30
CONFIG_SSH_SERVER_TCP_KEEPALIVE=y
CONFIG_SSH_SERVER_TCP_KEEPALIVE_IDLE=30
CONFIG_SSH_SERVER_TCP_KEEPALIVE_INTERVAL=10
CONFIG_SSH_SERVER_TCP_KEEPALIVE_COUNT=3
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=12
# The channel's rings (four per channel, in the server's object): a shell line and a screenful.
CONFIG_SSH_CHANNEL_BUF_SIZE=256
# Below the network threads' 10 and the USB threads' 8 that carry a stream, and not in front of the app: the key
# exchange and every login's signature check keep this thread busy for a while.
CONFIG_SSH_SERVER_THREAD_PRIORITY=10
# Key exchange, an ECDSA signature check on it; the Ed25519 check runs on the signature worker (src/extsig.c).
# The unused bytes after a session are in `ssh status`.
CONFIG_SSH_SERVER_STACK_SIZE=6144
CONFIG_INIT_STACKS=y
# Key types: ECDSA P-256 (the host key, made in a moment; RSA 2048 took more than 20 minutes on this core) and
# Ed25519 for users (src/sshd.c provides ssh_ed25519_verify()). No RSA at all: its PSA and mbedTLS code is not built.
CONFIG_SSH_HOST_KEY_RSA=n
CONFIG_SSH_HOST_KEY_ECDSA_P256=y
CONFIG_SSH_USER_KEY_ED25519=y
# The server's own shell backend takes every channel and refuses exec requests: src/console_mux.c does both. Zephyr's
# `net ssh_key` commands can print the private key: left out.
CONFIG_SHELL_BACKEND_SSH=n
CONFIG_NET_SHELL_SSH_KEYGEN=n

# The sockets: the listener and an eventfd, two connections, plus MCUmgr's and mDNS's.
CONFIG_ZVFS_OPEN_MAX=20
CONFIG_ZVFS_POLL_MAX=8

# The key made on the board is random only if the entropy source is the SoC's TRNG: zephyr,entropy on the S31 (trng0).
# CSPRNG_NEEDED enables that driver; TEST_RANDOM_GENERATOR must stay off (src/sshd.c has a BUILD_ASSERT).
CONFIG_CSPRNG_NEEDED=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n

# mbedTLS and PSA: the heap is one static buffer, placed in PSRAM (net_psram_s31.ld, after PSRAM is up: mbedTLS
# initializes it at POST_KERNEL). A login's key exchange and signature check, the host key and the key table live there;
# the exchange is the largest user.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=24

# `ssh key add` takes a whole authorized_keys line (ecdsa and ed25519 lines are 100 to 200 characters), typed or
# pasted into a shell: a command buffer and a serial ring that hold it.
CONFIG_SHELL_CMD_BUFF_SIZE=1024
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
