# MCUmgr (Simple Management Protocol) over UDP for the ESP32-S31 CoreBoard's multiapp host (apps/multiapp, phase 2 of
# doc/dev/network-services.md): image, OS and file groups, IPv4 and IPv6, port 4996. Added after
# net.conf by sysbuild.cmake. The host (src/netsvc.c) refuses every command (access denied) until `mcumgr arm <minutes>`.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=y
CONFIG_MCUMGR_TRANSPORT_UDP_PORT=4996
# No DTLS: the arm gate and the signed images are the protection (doc).
CONFIG_MCUMGR_TRANSPORT_UDP_DTLS=n

# A frame is one datagram and the router advertises MTU 1492 (the stack never fragments IPv6):
# 1492 - 40 (IPv6) - 8 (UDP) = 1444. Two buffers: a request and its response.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1444
CONFIG_MCUMGR_TRANSPORT_UDP_MTU=1444
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2

# Threads: below the radio, the app (0, 1) and the USB threads (8) like the network's. The work
# queue runs the handlers: image and file writes touch the flash (the cache is off meanwhile), so
# its stack is in the LP RAM (multiapp_lpram_s31.ld), never in PSRAM.
CONFIG_MCUMGR_TRANSPORT_UDP_THREAD_PRIO=10
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=10
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=3072
# 1024 overflowed on the board (97 and 100 % under SMP); no single-core peak was measured, so 2048.
CONFIG_MCUMGR_TRANSPORT_UDP_STACK_SIZE=2048

# The gate: a hook sees every command and every upload (src/netsvc.c).
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y

# img: upload, list, test, confirm, erase.
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_IMG_ALLOW_ERASE_PENDING=y

# os: echo, reset, info, MCUmgr parameters (buffer size and count: smpmgr and mcumgr use them).
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y

# fs: upload, download, status, CRC32 (not SHA-256: it would pull PSA crypto). The paths are
# limited to /FLASH:/; a transfer takes the volume from the PC for its length (src/netsvc.c).
CONFIG_FILE_SYSTEM=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_IEEE_CRC32=y
CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE_LIMIT=y
CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE=512
CONFIG_MCUMGR_GRP_FS_PATH_LEN=64
# MCUmgr closes an abandoned transfer's file from the system work queue after this long (ms). The
# volume stays claimed and mounted for 4 s after the last file command (netsvc.c, HOLD_IDLE_MS), so the
# close always runs under the claim: keep this below that.
CONFIG_MCUMGR_GRP_FS_FILE_AUTOMATIC_IDLE_CLOSE_TIME=3000
# No shell group.
CONFIG_MCUMGR_GRP_SHELL=n
