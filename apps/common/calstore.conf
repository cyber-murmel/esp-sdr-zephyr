#
# The crystal calibration in Zephyr settings, file backend on the FAT volume /FLASH:, as the
# MicroPython platforms name theirs. An app without such a volume also takes calstore.overlay,
# which puts one on the storage partition (mounted at boot, formatted on first mount):
#   list(APPEND EXTRA_CONF_FILE ${CMAKE_CURRENT_LIST_DIR}/../common/calstore.conf)
#   list(APPEND EXTRA_DTC_OVERLAY_FILE ${CMAKE_CURRENT_LIST_DIR}/../common/calstore.overlay)
# With dietemp.overlay too, each calibration records the die temperature and the correction
# follows a model over it (CONFIG_ESP_SDR_TEMP).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/FLASH:/settings"
CONFIG_ESP_SDR_CALSTORE=y
CONFIG_SENSOR=y
