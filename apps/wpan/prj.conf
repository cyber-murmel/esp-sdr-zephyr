CONFIG_NETWORKING=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=128

CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_MAIN_STACK_SIZE=2048

# The shell's interrupt-driven backend refills the transport one TX ring at a time. With the
# default 8 bytes, a ~130 byte sniffer line took ~17 rounds through CDC-ACM's work queue, and the
# S3 printed only 161 of 199 frames at 100 frames/s. The C6's USB-Serial-JTAG kept up.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
