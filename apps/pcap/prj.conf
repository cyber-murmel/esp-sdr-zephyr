#
# The ESP32-P4 as a burst sniffer: its ESP32-C6 radio over SDIO, the decoders, pcapng over USB.

CONFIG_GPIO=y
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y
# The SDIO reader polls the radio's byte counter; idle, it sleeps a tick (100 us).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# The decoders' floats; the burst buffers and scratch in PSRAM.
CONFIG_FPU=y
CONFIG_ESP_SPIRAM=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# USB device on the OTG HS port: the shell on CDC-ACM, DFU with sysbuild/MCUboot, the pcapng
# stream on a vendor bulk IN endpoint (src/usb_pcap.c). Same PID as the other apps (host udev
# rules, west dfu); the host tool finds it by its product string.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR pcap"
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y
CONFIG_HWINFO=y
# Vendor requests wait for the radio's reply over SDIO in the USB thread.
CONFIG_USBD_THREAD_STACK_SIZE=4096
# The USB threads preempt the decoder where they share a core, not the system work queue that
# feeds the liveness watchdog (as in apps/micropython on the P4).
CONFIG_USBD_THREAD_PREEMPTIBLE=y
CONFIG_UDC_DWC2_THREAD_PREEMPTIBLE=y
# Below the stream thread (5) and the control queue (6), above the decoder (8): a long decode
# does not hold the stream's transfers back (on one core; with two the decoder has its own).
CONFIG_USBD_THREAD_PRIORITY=7
CONFIG_UDC_DWC2_THREAD_PRIORITY=7
CONFIG_USBD_DFU_TRANSFER_SIZE=1024
CONFIG_UDC_BUF_POOL_SIZE=4096

# The shell on CDC-ACM (west dfu confirms images with "mcuboot confirm"), logs on the console
# UART (the CH340 on the WHY2025 badge).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_KERNEL_SHELL=y
CONFIG_MCUBOOT_SHELL=y
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_APP_LIVENESS_WATCHDOG=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
