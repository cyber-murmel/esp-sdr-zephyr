#
# The SoC turns the FPU on without sharing: the decoder thread, the channelizer and the shell
# (its float statistics) would clobber each other's float registers. Lazy switching (Zephyr
# decodes the trapping instruction from mtval, which the P4 fills).
CONFIG_FPU_SHARING=y
