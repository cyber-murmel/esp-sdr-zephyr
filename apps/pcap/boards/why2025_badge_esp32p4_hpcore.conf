#
# The WHY2025 badge's 32 MB of PSRAM: 128 burst buffers (16 MB). The survey's 40 channels hold
# one each while open and the channelizer can keep the decoder waiting for some 12 ms (the radio's
# block pool), during which a busy band opens a few dozen bursts.
CONFIG_APP_PCAP_BURSTS=128

# Both HP cores (doc/pcap.md, "The P4"): CPU 1 the stream thread (channelizer, PIE), CPU 0 the
# rest (the reader, USB, the decoders, the shell, the work queues). Pin-only: a thread nobody
# pins stays on CPU 0; IPIs only to the core a woken thread may run on.
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_IPI_OPTIMIZE=y
