# The Hackaday Communicator badge with its display and keyboard (socs/esp32s3_procpu.conf has
# what both ESP32-S3 boards share).

# No GDMA for the display SPI (overlay): DRAM ends at the ring banks.
CONFIG_DMA=n
# LVGL reads the keyboard every refresh; 2 queued keys fit the DRAM, 4 did not.
CONFIG_LV_Z_KEYPAD_INPUT_MSGQ_COUNT=2
