# The Hackaday Communicator badge with its display and keyboard (socs/esp32s3_procpu.conf has
# what both ESP32-S3 boards share).

# No GDMA for the display SPI (overlay): DRAM ends at the ring banks.
CONFIG_DMA=n
# LVGL reads the keyboard every refresh; 2 queued keys fit the DRAM, 4 did not.
CONFIG_LV_Z_KEYPAD_INPUT_MSGQ_COUNT=2
# DRAM ends at the ring banks, and this board's image reaches them: the kernel heap gave up 64 B
# (2026-11-06), then 192 more (2026-11-10: the image had grown 144 B past them since).
CONFIG_HEAP_MEM_POOL_SIZE=15616
# The HAL's early boot lines at warnings: its info lines (the loader's segment map, the libc
# heap) keep their strings in DRAM, and this board's image had reached the ring banks again
# (2026-11-17: 40 B past them).
CONFIG_ESP_HAL_EARLY_LOG_LEVEL=2
