# The Waveshare ESP32-C5-Zero as the bench's coordinator: MicroPython headless (no display) on
# the USB-Serial-JTAG console, no PSRAM; receive through the diagnostic-bus ring, transmit
# through the CPU-paced TX DC path; the bench's RF switch from Python (rfswitch). prj.conf has
# what every board shares.

# The U.FL port, which goes to the RF switch, instead of the chip antenna.
CONFIG_WAVESHARE_ESP32C5_ZERO_EXT_ANTENNA=y

# MicroPython runs in the main thread (the port's own start): a GRC export's console loop with
# the packet link nests about 25 Python calls; 10 KiB overflowed.
CONFIG_MAIN_STACK_SIZE=16384
# The port's heap, in SRAM block 0 (src/c5_low.ld); esdr_port_init() adds the upper half of SRAM
# block 1 and most of the libc heap in block 2, which nothing else here needs (esdr_c5.c).
CONFIG_MICROPY_HEAP_SIZE=20480
CONFIG_MICROPY_FROZEN_MANIFEST="manifest_c5.py"
# The bundled apps that run headless on this radio.
CONFIG_APP_EGGS="datalink"

CONFIG_ESP_SDR_RFTEST=y
CONFIG_ESP_SDR_PACED=y
CONFIG_ESP_SDR_DIAG=y

# The Wi-Fi driver's buffers come from the system heap (no PSRAM): fewer of them.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8

# machine.Pin for the RF switch.
CONFIG_GPIO=y

# The kernel heap, which the Wi-Fi driver allocates from here (its default asks for 55 KiB):
# 24 KiB was too little for it to start.
CONFIG_HEAP_MEM_POOL_SIZE=40960
