# SPDX-License-Identifier: GPL-3.0-or-later
#
# The VIEWE ESP32-S31 board: MicroPython with LVGL on the 800x480 display, the touch screen, the
# REPL on the console UART (the CH340), the Python heap in PSRAM, the radio on the chip (bursts,
# cmod/esdr_local.c). prj.conf has what every board shares, radio_phy.conf the radio.

# MicroPython runs in the main thread (the port's own start); a GUI export with LVGL peaked at
# 11.9 KiB on the S3. 28 KiB, not 32, and the token heap below keep the image under the TCM group
# the DAC engine and the dump ring use.
CONFIG_MAIN_STACK_SIZE=28672
# The port's own heap in SRAM is a token; esdr_port_init() adds the PSRAM heap.
CONFIG_MICROPY_HEAP_SIZE=2048
CONFIG_APP_MP_PSRAM_HEAP_KB=8192
CONFIG_MICROPY_FROZEN_MANIFEST="manifest.py"
# Transmit: a carrier (Tone) and buffers (Data link's bursts). Buffers repeated
# (tx_start(..., repeat=True)) loop through the DAC engine, the CPU running on.
CONFIG_ESP_SDR_REPLAY=y
# Buffered streams at 250 kS/s and below and at 2 MS/s without gaps, Data link's receiver among
# them: the dump ring on the worker's CPU. With it the ring stage for the Pcap app's engine.
CONFIG_ESP_SDR_DUMPRING=y
CONFIG_ESP_SDR_RING_STAGE=y
CONFIG_APP_EGGS="bursts,constellation,datalink,pcap,receiver,scan,spectrum,tone,waterfall"
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_ESP_SPIRAM=y
CONFIG_HEAP_MEM_POOL_SIZE=32768

# The FAT volume /FLASH: (overlay).
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FS_FATFS_NUM_FILES=8
CONFIG_FS_FATFS_NUM_DIRS=4
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_EXFAT=y

CONFIG_GPIO=y
# os.urandom (the data link's node id); on the radio chips Wi-Fi brings the TRNG in.
CONFIG_ENTROPY_GENERATOR=y

# LVGL on the panel (framebuffers in PSRAM), its heap in the MicroPython heap, its draw buffers in
# SRAM (static, as on the WHY2025 badge); the touch screen as its pointer. BOOT held goes home
# (INPUT_KEY_0), as does the top left corner of the screen.
CONFIG_DISPLAY=y
# Two framebuffers: LVGL's frame reaches the panel whole, a waterfall's scroll without a tear.
CONFIG_DISPLAY_ESP32_LCD_RGB_DOUBLE_BUFFER=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_APP_HOME_CODE=11
# tools/screen.py: nothing else shows this board's screen to a script.
CONFIG_APP_CONSOLE_REMOTE=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_MICROPYTHON=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_VDB_SIZE=6
# One draw buffer: the flush is synchronous, so a second one overlaps nothing (the GUI's redraws
# measured the same) and its 46 KiB keep the image below the DAC engine's group.
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_DEF_REFR_PERIOD=20
# Both cores, so that buffered streams run gapless through the dump ring on CPU 1: every thread
# on CPU 0 but the radio worker (cmod/esdr_local.c) and, below it, the Scan app's spectra
# (cmod/esdr_gui.c), which go to CPU 1. Measured before the ring:
# CPU 0 idle 10 -> 36 %, the GUI's redraws the same, a display's stream a quarter to a third fewer
# bursts (the worker shares the cache with the GUI; the ring works in TCM, which it does not).
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
