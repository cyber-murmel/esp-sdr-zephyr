# SPDX-License-Identifier: GPL-3.0-or-later
#
# The WHY2025 badge's ESP32-P4: MicroPython with LVGL on the 720x720 display, the keyboard,
# the REPL on the console UART (the CH340), the Python heap in PSRAM. No radio on the chip
# (no radio.conf): the badge's ESP32-C6 is the radio. prj.conf has what every board shares.

# MicroPython runs in the main thread (the port's own start); a GUI export with LVGL peaked at
# 11.9 KiB on the S3.
CONFIG_MAIN_STACK_SIZE=32768
# The port's own heap in SRAM is a token; esdr_port_init() adds the PSRAM heap.
CONFIG_MICROPY_HEAP_SIZE=16384
CONFIG_APP_MP_PSRAM_HEAP_KB=16384
CONFIG_MICROPY_FROZEN_MANIFEST="manifest.py"
CONFIG_FPU=y
# The SoC turns the FPU on without sharing: a thread that preempts another in float code (the
# channelizer, esdr_gl.c, above MicroPython) would leave its registers behind. Lazy switching
# (Zephyr decodes the trapping instruction from mtval, which the P4 fills).
CONFIG_FPU_SHARING=y
CONFIG_HEAP_MEM_POOL_SIZE=32768

# The FAT volume /FLASH: and the SD card /SD: (overlay).
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FS_FATFS_NUM_FILES=8
CONFIG_FS_FATFS_NUM_DIRS=4
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_EXFAT=y

CONFIG_GPIO=y
# os.urandom (the data link's node id); on the radio chips Wi-Fi brings the TRNG in.
CONFIG_ENTROPY_GENERATOR=y

# LVGL on the DSI display (framebuffers in PSRAM), its heap in the MicroPython heap, its draw
# buffers in SRAM (static: drawing into PSRAM ones and transposing out of them for the turned
# panel cost a third more); the keyboard as an LVGL keypad.
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_MICROPYTHON=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_VDB_SIZE=6
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_DEF_REFR_PERIOD=20

# The radio's link (UART1 at 5 Mbaud): an interrupt per 96 received bytes, not per byte (the
# console's UART shares the setting, harmlessly).
CONFIG_UART_ESP32_RX_FIFO_THRESH=0x60
# The transmit FIFO wakes the link's writer with 64 bytes (128 us) still to send.
CONFIG_UART_ESP32_TX_FIFO_THRESH=0x40
# The radio's link: SDIO function 1 to the C6 on sdhc1 (cmod/esdr_remote.c).
CONFIG_SDIO_STACK=y
# The SDIO reader polls the radio's byte counter; idle, it sleeps a tick: 100 us, not 1 ms
# (at 2 MS/s the radio fills a 4 KB block in 1 ms).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# USB device on USB-C J8 (OTG HS): the REPL on CDC-ACM, DFU with sysbuild/MCUboot; the port's
# mp_usbd_init() starts it (cmod/esdr_usb.c).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR MicroPython"
# Same PID as the other apps (host udev rules).
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_THREAD_STACK_SIZE=2048

# The shell has no serial backend (nothing may print into the REPL): its dummy backend serves
# esdr.shell(), for "mcuboot confirm" after west dfu and "kernel uptime".
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_HISTORY=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_MCUBOOT_SHELL=y
# As on the S3: west dfu confirms from the REPL (esdr.shell), so no trial revert, but a hang
# resets the board.
CONFIG_APP_TRIAL_WATCHDOG=n
CONFIG_APP_LIVENESS_WATCHDOG=y
# One CPU: the USB threads preempt MicroPython (main, 10) but not the system work queue, which
# feeds the liveness watchdog (cooperative, the USB thread held it off through a DFU download
# until the watchdog reset the board).
CONFIG_USBD_THREAD_PREEMPTIBLE=y
CONFIG_UDC_DWC2_THREAD_PREEMPTIBLE=y
CONFIG_MAIN_THREAD_PRIORITY=10
# DFU in 1 KiB blocks (the most the class takes): each block costs a status round trip. The
# request pool holds one such control transfer next to CDC-ACM's 512-byte bulk buffers.
CONFIG_USBD_DFU_TRANSFER_SIZE=1024
CONFIG_UDC_BUF_POOL_SIZE=4096
