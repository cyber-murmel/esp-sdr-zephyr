# The XIAO ESP32S3 with the display, the knob and the SD card (socs/esp32s3_procpu.conf has
# what both ESP32-S3 boards share).

# SD card on SPI2 (overlay), settings as in cyber-murmel/mp-lvgl-example.
CONFIG_SD_DATA_TIMEOUT=25000
CONFIG_SD_DATA_RETRIES=5

# The ST7789V takes its RGB565 pixels high byte first.
CONFIG_LV_COLOR_16_SWAP=y
