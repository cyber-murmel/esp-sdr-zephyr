# The XIAO ESP32S3 with the display, the knob and the SD card: MicroPython on the USB
# CDC-ACM console, PSRAM, LVGL, the receive ring and the DAC transmitter (prj.conf has what
# every board shares).
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# main() only starts the MicroPython thread (boot.c), whose stack is APP_MP_STACK_SIZE.
CONFIG_MAIN_STACK_SIZE=1024
# Peak 512 with the ring (apps/osmosdr).
CONFIG_ISR_STACK_SIZE=1024
# The Wi-Fi driver peaks at about 15.5 KiB of kernel heap (doc/multiapp.md); with 13 KiB the
# board did not get as far as USB.
CONFIG_HEAP_MEM_POOL_SIZE=15872

# The REPL's console is CDC-ACM (its line state).
CONFIG_UART_LINE_CTRL=y

# The port's heap, a token in DRAM: esdr_port_init() adds internal RAM above the capture bank
# and the bulk in PSRAM (APP_MP_PSRAM_HEAP_KB).
CONFIG_MICROPY_HEAP_SIZE=512
CONFIG_MICROPY_FROZEN_MANIFEST="manifest.py"

CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y

# The shell has no serial backend (nothing may print into the REPL): its dummy backend serves
# esdr.shell().
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_KERNEL_SHELL=y
# The dummy backend runs commands on the caller's stack (esdr.shell()); measured peak 752.
CONFIG_SHELL_STACK_SIZE=1024
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_HISTORY=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n

# USB device on the OTG port: the REPL on CDC-ACM, DFU with sysbuild/MCUboot.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR MicroPython"
# Same PID as the other apps (host udev rules).
CONFIG_SAMPLE_USBD_PID=0x0005
# Measured peak 1024 with MSC.
CONFIG_USBD_THREAD_STACK_SIZE=1536
CONFIG_UDC_DWC2_STACK_SIZE=1280
CONFIG_USBD_CDC_ACM_CLASS=y
# CDC-ACM carries the console: its own logging must stay off, which usbd_cdc_acm.c otherwise
# enforces with a #warning that -Werror makes fatal.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# west dfu confirms through the shell on CDC-ACM, which the REPL owns: no trial
# revert (an image the REPL does not answer for is still caught by the liveness watchdog).
# The "mcuboot confirm" shell command stays: esdr.shell("mcuboot confirm") from the REPL.
CONFIG_MCUBOOT_SHELL=y
CONFIG_APP_TRIAL_WATCHDOG=n
CONFIG_APP_LIVENESS_WATCHDOG=y

# Continuous receive: three dump banks, so the DRAM image ends below 0x3fcb0000.
CONFIG_ESP_SDR_RING=y
# Transmit: the DAC backend (esdr_tx.c feeds its input ring), its buffers and stacks above the
# capture bank. A quarter of the default ring: PSRAM is shared with the Python heap.
CONFIG_ESP_SDR_TX=y
CONFIG_ESP_SDR_TX_DAC=y
CONFIG_ESP_SDR_TX_DAC_HIGH_RAM=y
CONFIG_ESP_SDR_TX_DAC_RING_SAMPLES=65536

# PSRAM (8 MB octal): the bulk of the Python heap and the Wi-Fi heap.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8
CONFIG_ESP32_WIFI_EVENT_TASK_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024

# The FAT volume on the upper 4 MB of flash (overlay), /FLASH: in Python. Small: the DRAM
# image must end below the ring banks.
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_DRIVER_FLASH=y
# MicroPython closes files only when collected: exec(open(f).read()) holds one until then.
CONFIG_FS_FATFS_NUM_FILES=8
CONFIG_FS_FATFS_NUM_DIRS=4
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_EXFAT=y

# SD card on SPI2 (overlay), settings as in cyber-murmel/mp-lvgl-example.
CONFIG_SPI=y
CONFIG_SD_DATA_TIMEOUT=25000
CONFIG_SD_DATA_RETRIES=5

# Both volumes on USB: LUN 0 FLASH, LUN 1 SD (src/usb_disks.c).
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=2
CONFIG_USBD_MSC_DOUBLE_BUFFERING=n
# The SD card path (disk, SD stack, SPI driver) is deeper than multiapp's flash disk: 1152
# overflowed into the USB thread's stack (double exception in a window underflow).
# Measured peak 1232.
CONFIG_USBD_MSC_STACK_SIZE=1600
# Stack peaks on the console: zephyr.stack_analyze().
CONFIG_INIT_STACKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y

# The ST7789V on the SD card's SPI bus (overlay).
CONFIG_DISPLAY=y
# The encoder and its switch (overlay): callbacks in the drivers' context, no input thread.
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# LVGL for MicroPython (the lvgl module, ZDD.init()), as in the tube station firmware: LVGL
# allocates from the Python heap (Zephyr: modules/lvgl, LV_Z_MEM_POOL_MICROPYTHON), its
# rendering buffers too (dynamic: PSRAM, the DRAM image has no room), and MicroPython runs its
# timers (lv_utils), not a work queue.
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_MICROPYTHON=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_DEF_REFR_PERIOD=20
