# SPDX-License-Identifier: GPL-3.0-or-later
#
# The MCH2022 badge's ESP32: MicroPython with LVGL on the 320x240 display, the buttons, the
# REPL on the console UART (the RP2040's first USB serial port), the Python heap in PSRAM, the
# radio on the chip (bursts, cmod/esdr_local.c). prj.conf has what every board shares,
# radio.conf the radio.

# MicroPython runs in the main thread (the port's own start); a GUI export with LVGL peaked at
# 11.9 KiB on the S3.
CONFIG_MAIN_STACK_SIZE=16384
# The port's own heap in SRAM is a token; esdr_port_init() adds the PSRAM heap (of the 4 MiB
# the ESP32 maps).
CONFIG_MICROPY_HEAP_SIZE=8192
CONFIG_ESP_SPIRAM=y
CONFIG_APP_MP_PSRAM_HEAP_KB=3072
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
# The Wi-Fi driver allocates from the PSRAM heap, with some 25 KB of the kernel heap (the
# minimum it asks for then); the radio only listens (promiscuous, no traffic): a few buffers.
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_HEAP_MEM_POOL_SIZE=26624
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=2
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
# The capture bank is SRAM1, where .noinit would spill otherwise.
CONFIG_ESP32_REGION_1_NOINIT=n

# The FAT volume /FLASH: and the SD card /SD: (overlay).
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FS_FATFS_NUM_FILES=8
CONFIG_FS_FATFS_NUM_DIRS=4
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=64

CONFIG_GPIO=y

# The buttons through the RP2040 (an LVGL keypad), its backlight.
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_APP_HOME_CODE=102

# LVGL on the ILI9341 (big-endian RGB565, which LVGL renders as such: no LV_COLOR_16_SWAP), its
# heap in the MicroPython heap, its draw buffer in SRAM: the display's SPI DMA cannot read PSRAM.
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_MICROPYTHON=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_DEF_REFR_PERIOD=20
