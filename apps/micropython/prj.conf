# MicroPython (modules/micropython/ports/zephyr/prj.conf) with the radio, on every board; what
# a board adds is in boards/<board>.conf (the S3: USB, PSRAM, display, SD card, the ring; the
# C5: the diagnostic-bus ring and the paced transmitter).
CONFIG_POLL=y
CONFIG_REBOOT=y
# The port's zsensor module includes the sensor API; no sensor, no code.
CONFIG_SENSOR=y
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# REPL input comes from the console driver's receive hook (src/zephyr_getchar.c), output
# goes to the console UART directly.
CONFIG_SERIAL=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_UART_CONSOLE_DEBUG_SERVER_HOOKS=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_MICROPY_CONFIGFILE="mpconfigport_esdr.h"
CONFIG_MICROPY_FROZEN_MODULES=y
CONFIG_MICROPY_CONFIG_ROM_LEVEL_EXTRA_FEATURES=y

# Nothing may print into the REPL: no log backend.
CONFIG_LOG=n

CONFIG_RESET_ON_FATAL_ERROR=y

# The radio: the Wi-Fi driver brings it up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
# No IP traffic: the network stack only carries the Wi-Fi driver, minimal.
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_RX_STACK_SIZE=1024
CONFIG_NET_L2_WIFI_SHELL=n

CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_RX_DECIM=n

# MicroPython's Zephyr port (machine_spi.c, v1.29, built wherever SPI is on: both boards)
# still uses SPI_OP_MODE_MASTER, whose deprecation warning -Werror (twister, CI) makes fatal.
CONFIG_WARN_DEPRECATED=n
