# The radio on the chip itself, for every board but the WHY2025 badge's ESP32-P4 (CMakeLists.txt):
# the Wi-Fi driver brings it up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
# No IP traffic: the network stack only carries the Wi-Fi driver, minimal.
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_RX_STACK_SIZE=1024
CONFIG_NET_L2_WIFI_SHELL=n

CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_RX_DECIM=n
