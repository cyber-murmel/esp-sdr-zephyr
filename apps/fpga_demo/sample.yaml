sample:
  name: ESP-SDR FPGA demo
  description: >-
    The MCH2022 badge's iCE40 (gateware/) from the shell: the SPI link, graphics from software
    data and the DSP chain; CONFIG_ESDR_FPGA_IMAGE embeds a bitstream to load at boot
common:
  tags: esp-sdr
  # Driven from the shell by hand (doc/fpga-accelerator.md); tests/integration/esdr_fpga is the
  # test on the badge.
  build_only: true
  platform_allow:
    - mch2022/esp32/procpu
  integration_platforms:
    - mch2022/esp32/procpu
tests:
  sample.esp_sdr.fpga_demo: {}
  # The badge's own radio for fpga radio and fpga dump.
  sample.esp_sdr.fpga_demo.radio:
    extra_args: EXTRA_CONF_FILE=radio.conf
