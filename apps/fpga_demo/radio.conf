# The badge's own radio (lib/esp_sdr bursts) for fpga radio and fpga dump:
# -DEXTRA_CONF_FILE=radio.conf. The Wi-Fi driver brings the radio up; nothing scans.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
CONFIG_ESP_SDR=y
# The capture bank is SRAM1, where .noinit would spill otherwise.
CONFIG_ESP32_REGION_1_NOINIT=n
CONFIG_MAIN_STACK_SIZE=6144
