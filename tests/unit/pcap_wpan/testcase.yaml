tests:
  unit.esp_sdr.pcap_wpan:
    # Twenty frames modulated at 80 MS/s and channelized with the C kernels take a while on a
    # loaded machine; the timeout only bounds hangs.
    timeout: 300
    tags:
      - esp-sdr
      - pcap
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
