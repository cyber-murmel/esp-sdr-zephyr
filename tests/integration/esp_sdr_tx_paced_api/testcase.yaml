common:
  tags:
    - esp-sdr
    - hardware
  harness: ztest
  timeout: 120

tests:
  # The S31 first, flashed over its UART bridge, without the Wi-Fi driver; the C5 and C6 run
  # the same stream once their TX DC register is in src/main.c.
  integration.esp_sdr.tx_paced_api.s31:
    platform_allow:
      - esp32s31_function_coreboard/esp32s31/hpcore
      - ues31s043h800v480c_u/esp32s31/hpcore
  # The block path: the DAC words computed by a thread pinned to the other core (CPU 0 stores,
  # CPU 1 fills; every thread starts on CPU 0 with PIN_ONLY).
  integration.esp_sdr.tx_paced_api.s31.smp:
    extra_configs:
      - CONFIG_SMP=y
      - CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
      - CONFIG_ESP_SDR_PACED_TX_BLOCK=y
    platform_allow:
      - esp32s31_function_coreboard/esp32s31/hpcore
      - ues31s043h800v480c_u/esp32s31/hpcore
  # SMP on, the per-word path as before: the poll alone on CPU 0 with the second core running.
  integration.esp_sdr.tx_paced_api.s31.smp_word:
    extra_configs:
      - CONFIG_SMP=y
      - CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
    platform_allow:
      - esp32s31_function_coreboard/esp32s31/hpcore
      - ues31s043h800v480c_u/esp32s31/hpcore
