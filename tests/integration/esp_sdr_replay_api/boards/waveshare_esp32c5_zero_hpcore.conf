# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
# The RF switch to the U.FL coax port instead of the chip antenna.
CONFIG_WAVESHARE_ESP32C5_ZERO_EXT_ANTENNA=y
# The replay under test.
CONFIG_ESP_SDR_REPLAY=y
