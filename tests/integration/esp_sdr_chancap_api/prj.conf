# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_RX_STACK_SIZE=1024

CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_RING=y
# Raw only: the decimating FIR stays out of IRAM.
CONFIG_ESP_SDR_RING_FIR=n
CONFIG_ESP_SDR_CHANCAP=y
CONFIG_ESP_SDR_RX_DECIM=n

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=1536

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=256
# The reports go to the console directly: through the log's small buffer, lines were dropped.
CONFIG_LOG_PRINTK=n
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_ISR_STACK_SIZE=1024

CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y

# USB device on the OTG port: shell on CDC-ACM, DFU with sysbuild/MCUboot.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR chancap test"
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_DWC2_STACK_SIZE=1280
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=256
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_NET_L2_WIFI_SHELL=n

# Internal RAM: three 64 KiB dump banks must fit; the Wi-Fi heap and the capture slab in PSRAM.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=2
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_NUM_MBOX_ASYNC_MSGS=0
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8
CONFIG_ESP32_WIFI_EVENT_TASK_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# A crash reboots instead of halting with the USB port gone (a test image has no watchdog).
CONFIG_RESET_ON_FATAL_ERROR=y
# Recovery without the BOOT button: 3 s on the USB-Serial-JTAG after every boot, so esptool
# can reset into the ROM bootloader; and a wedged system resets.
CONFIG_APP_USB_START_DELAY_MS=3000
CONFIG_APP_LIVENESS_WATCHDOG=y

# CDC-ACM on its own work queue, as the other S3 test and multiapp: the shell stays alive
# after the suite printed more than the host read.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=896

# The system work queue and the CDC-ACM class's work queue (the shell's console output) run
# at this priority: preemptible, below the channelizer, which else waits for a work item to
# finish (hundreds of us per USB packet of console output).
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=11
# The channelizer sleeps a tick when it has caught up: 50 us ticks halve what that costs of
# the hand-over ring's slack.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000
# The USB device stack's thread and the DWC2 driver's are cooperative by default and run
# hundreds of microseconds per transfer burst: preemptible here, for the same reason.
CONFIG_USBD_THREAD_PREEMPTIBLE=y
CONFIG_UDC_DWC2_THREAD_PREEMPTIBLE=y
