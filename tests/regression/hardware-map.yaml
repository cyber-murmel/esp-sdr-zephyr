# Hardware map of the boards on the desk, for the two-board regression tests
# (scripts/run-regression-tests.sh, doc/testing.md). For another desk change the
# serial numbers: `ls /dev/serial/by-id` shows them.
#
# id: what scripts/twister-flash.py gets as --board-id. The C6's is the serial number of
#     its USB-Serial-JTAG, the S3's the USB serial number of the esp-sdr firmware.
# product, runner: required by twister's schema, unused here: the flash command, not a west
#     runner, puts the images on the boards.
# flash_before: connect to the console only after the flash. The C6 resets when its port is
#     opened, and the S3's port goes away and comes back during the DFU update.
# serial: the S3's path carries the product string of the wpan firmware, which is the image
#     twister puts on it before it opens the port.

- id: 98:A3:16:8E:29:9C
  platform: xiao_esp32c6/esp32c6/hpcore
  product: USB JTAG/serial debug unit
  runner: esp32
  serial: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_98:A3:16:8E:29:9C-if00
  connected: true
  flash_before: true
  flash_timeout: 120

- id: A4CB8FD1C700
  platform: xiao_esp32s3/esp32s3/procpu
  product: ESP-SDR 802.15.4
  runner: esp32
  serial: /dev/serial/by-id/usb-Zephyr_Project_ESP-SDR_802.15.4_A4CB8FD1C700-if00
  connected: true
  flash_before: true
  flash_timeout: 300
