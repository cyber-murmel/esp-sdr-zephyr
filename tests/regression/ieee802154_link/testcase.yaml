tests:
  # Two-board regression test (pytest/test_interop.py): a real C6 and a real S3
  # exchanging apps/wpan's test frames, both ways. Needs both boards in a
  # hardware map: scripts/run-regression-tests.sh runs it with
  # tests/regression/hardware-map.yaml (see doc/dev/testing.md). Twister flashes
  # and resets both, so the two per-board ids below exist only to be built
  # (build_only), and are referenced by id from the scenario id.
  regression.esp_sdr.ieee802154_link.c6:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - xiao_esp32c6/esp32c6/hpcore
    build_only: true

  regression.esp_sdr.ieee802154_link.s3:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - xiao_esp32s3/esp32s3/procpu
    sysbuild: true
    build_only: true

  # The driver as a Zephyr L2 network interface (doc/modem/ieee802154.md, "Open"): built only, so
  # that the path keeps compiling. The L2 takes about 400 bytes more DRAM than the image has
  # below the ring banks; the kernel heap gives them up here, as the image is not run.
  regression.esp_sdr.ieee802154_link.s3_l2:
    tags:
      - esp-sdr
      - regression
    platform_allow:
      - xiao_esp32s3/esp32s3/procpu
    sysbuild: true
    extra_configs:
      - CONFIG_NET_L2_IEEE802154=y
      - CONFIG_HEAP_MEM_POOL_SIZE=15360
    build_only: true

  # The ESP32-S3-DevKitC (N16R8) in place of the XIAO S3; apps/wpan/boards/ gives it its PSRAM.
  regression.esp_sdr.ieee802154_link.s3_devkit:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    sysbuild: true
    build_only: true

  # The XIAO C6 on its chip antenna: with the board's U.FL switch unpowered the radio is nearly
  # deaf, so apps/wpan drives the switch itself (WPAN_C6_CHIP_ANTENNA). For desks without coax.
  regression.esp_sdr.ieee802154_link.c6_chip:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - xiao_esp32c6/esp32c6/hpcore
    extra_configs:
      - CONFIG_XIAO_ESP32C6_EXT_ANTENNA=n
      - CONFIG_WPAN_C6_CHIP_ANTENNA=y
    build_only: true

  regression.esp_sdr.ieee802154_link:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - xiao_esp32c6/esp32c6/hpcore
    harness: pytest
    # Flashing both boards (the S3 over DFU takes about a minute) happens inside the
    # pytest run, so it counts against this timeout.
    timeout: 900
    harness_config:
      pytest_root:
        - "pytest/test_interop.py"
        - "pytest/test_sniffer.py"
      # Flash and connect once for all tests; the module-scoped radios_on fixture
      # needs the shells to live as long.
      pytest_dut_scope: module
      required_devices:
        - platform: xiao_esp32s3/esp32s3/procpu
          application: regression.esp_sdr.ieee802154_link.s3
    build: false
    required_applications:
      - application: regression.esp_sdr.ieee802154_link.c6

  # The same two tests on the desk with the DevKitC and the C6 on its chip antenna.
  # Run only this one: scripts/run-regression-tests.sh -O <dir> -s regression.esp_sdr.ieee802154_link.devkit
  regression.esp_sdr.ieee802154_link.devkit:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - xiao_esp32c6/esp32c6/hpcore
    harness: pytest
    timeout: 900
    harness_config:
      pytest_root:
        - "pytest/test_interop.py"
        - "pytest/test_sniffer.py"
      pytest_dut_scope: module
      required_devices:
        - platform: esp32s3_devkitc/esp32s3/procpu
          application: regression.esp_sdr.ieee802154_link.s3_devkit
    build: false
    required_applications:
      - application: regression.esp_sdr.ieee802154_link.c6_chip
