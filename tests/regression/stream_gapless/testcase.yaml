tests:
  # Two-board regression test of the gapless streams (pytest/test_gapless.py): one board
  # transmits a tone, the other receives it through the coax link, both ways round; the
  # recording must have no gap. Needs the boards in a hardware map: scripts/run-regression-tests.sh
  # runs it with tests/regression/hardware-map.yaml (see doc/testing.md). Twister flashes and
  # resets both, so the per-board ids below exist only to be built (build_only), and are
  # referenced by id from the scenario ids.
  regression.esp_sdr.stream_gapless.c6:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - xiao_esp32c6/esp32c6/hpcore
    build_only: true

  # The C5 with the receive paced by the CPU through the IQ estimator (the app's default).
  regression.esp_sdr.stream_gapless.c5:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - waveshare_esp32c5_zero/esp32c5/hpcore
    build_only: true

  # The C5 with the receive from the diagnostic-bus ring (diag.conf of the app).
  regression.esp_sdr.stream_gapless.c5_diag:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - waveshare_esp32c5_zero/esp32c5/hpcore
    extra_args:
      - EXTRA_CONF_FILE=diag.conf
    build_only: true

  regression.esp_sdr.stream_gapless.c6_c5:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - xiao_esp32c6/esp32c6/hpcore
    harness: pytest
    # Flashing both boards happens inside the pytest run; four streams of about 35 s each.
    timeout: 600
    harness_config:
      pytest_root:
        - "pytest/test_gapless.py"
      pytest_dut_scope: module
      required_devices:
        - platform: waveshare_esp32c5_zero/esp32c5/hpcore
          application: regression.esp_sdr.stream_gapless.c5
    build: false
    required_applications:
      - application: regression.esp_sdr.stream_gapless.c6

  regression.esp_sdr.stream_gapless.c6_c5_diag:
    tags:
      - esp-sdr
      - hardware
      - regression
    platform_allow:
      - xiao_esp32c6/esp32c6/hpcore
    harness: pytest
    timeout: 600
    harness_config:
      pytest_root:
        - "pytest/test_gapless.py"
      pytest_dut_scope: module
      required_devices:
        - platform: waveshare_esp32c5_zero/esp32c5/hpcore
          application: regression.esp_sdr.stream_gapless.c5_diag
    build: false
    required_applications:
      - application: regression.esp_sdr.stream_gapless.c6
