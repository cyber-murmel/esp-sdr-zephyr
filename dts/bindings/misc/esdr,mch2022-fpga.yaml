description: |
  esp-sdr gateware (gateware/) on the MCH2022 badge's iCE40UP5K: a child of the board's
  lattice,ice40-fpga node, which configures the FPGA. The configuration port doubles as the
  gateware's SPI slave.

compatible: "esdr,mch2022-fpga"

properties:
  frequency:
    type: int
    required: true
    description: SPI clock for frames; the parent's is the configuration port's, at most 25 MHz.

  irq-gpios:
    type: phandle-array
    description: FPGA interrupt, active low (ESP32 IO39).

  read-frequency:
    type: int
    default: 20000000
    description: |
      SPI clock for reads. MISO comes through the GPIO matrix; at 40 MHz the HAL inserts a
      timing dummy bit, below 26.7 MHz it does not.
