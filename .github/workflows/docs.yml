# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the documentation (doc/: Doxygen API reference and the Sphinx site)
# as Zephyr's example application does, and publishes it to GitHub Pages from
# pushes to main. Pull requests get it as an artifact.

name: Documentation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      DOXYGEN_VERSION: 1.15.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Doxygen, the Python packages and Espressif's SVDs (svdmerge.py pins their commit), from
      # main's cache where it holds; main saves it after the register pages.
      - name: Restore the documentation's inputs
        id: inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            doxygen-${{ env.DOXYGEN_VERSION }}
            ~/.cache/pip
            _svd/espressif
          key: docs-${{ env.DOXYGEN_VERSION }}-${{ hashFiles('doc/requirements.txt', 'doc/registers/svdmerge.py') }}

      - name: Install dependencies
        run: |
          if [ ! -x "doxygen-${DOXYGEN_VERSION}/bin/doxygen" ]; then
            wget --no-verbose "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
            tar xf "doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
            rm "doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          fi
          echo "${PWD}/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
          pip install -r doc/requirements.txt
          # rsvg-convert, for the logo's PNG and ICO formats (doc/logo/logo.py)
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin

      # The register pages are generated from doc/registers/*.svd, which merge into Espressif's SVD.
      - name: Register pages
        run: |
          python3 doc/registers/svd2md.py --check
          python3 doc/registers/svdmerge.py --out _svd

      # The radio diagrams, the filter plots and the pages' Previous/Up/Next links are generated.
      - name: Generated pages
        run: |
          python3 doc/radio/transceiver.py --check
          python3 doc/radio/filters.py --check
          python3 doc/nav.py --check

      - name: Save the documentation's inputs
        if: steps.inputs.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            doxygen-${{ env.DOXYGEN_VERSION }}
            ~/.cache/pip
            _svd/espressif
          key: docs-${{ env.DOXYGEN_VERSION }}-${{ hashFiles('doc/requirements.txt', 'doc/registers/svdmerge.py') }}

      - name: Build
        run: |
          cd doc
          doxygen
          SPHINXOPTS="-W" make html

      - name: Setup pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/_build_sphinx/html

      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: doc/_build_sphinx/html

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
