manifest:
  self:
    path: esp-sdr-zephyr
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: cyber-murmel
      url-base: https://github.com/cyber-murmel
    - name: espargos
      url-base: https://github.com/ESPARGOS
    - name: espressif
      url-base: https://github.com/espressif
    - name: eliben
      url-base: https://github.com/eliben
    - name: micropython
      url-base: https://github.com/micropython

  projects:
    # Zephyr with ESP32-S3 SMP (zephyrproject-rtos/zephyr#120082, rebased), the
    # CDC-NCM NTB aggregation the USB stream relies on, the llext and Xtensa
    # changes apps/multiapp needs (doc/multiapp.md, "Zephyr changes"), LVGL
    # allocating from the MicroPython heap (apps/micropython), the options
    # that make the USB stack and DWC2 threads preemptible (apps/chancap) and
    # the Hackaday Communicator, WHY2025 and MCH2022 badges with their NV3007,
    # ST7703, TCA8418 and RP2040 coprocessor drivers, an SX126x without BUSY
    # and DIO1 lines and the ESP32 SPI timing fixes, and the
    # ESP32-P4-Function-EV-Board's C6 and V1.0B (ESP-IDF bootloader mode,
    # esp-hosted OTA, P4 rev v0.0) (branches communicator-badge,
    # why2025-badge, mch2022-badge, p4-function-ev-board).
    - name: zephyr
      remote: cyber-murmel
      revision: 9e90a821cf42644259b2d71925fdfe835469710c # p4-function-ev-board
      path: modules/zephyr
      import:
        name-allowlist:
          - fatfs
          - loramac-node
          - mcuboot
          - mbedtls
          - nanopb
          - tf-psa-crypto
    # The HAL companion of the SMP port, with the ESP32-P4 flash erase fix
    # (the line levels kept when SPI1's control register is cleared) and the
    # P4 rev v0.0 clock (from the ROM's CPLL); listed here so it overrides
    # the revision Zephyr's own manifest pins.
    - name: hal_espressif
      remote: cyber-murmel
      revision: 1721d85be6b6794bd6a1f54f849ffa9202f581eb # esp-sdr branch
      path: modules/hal/espressif
      groups:
        - hal
    # VITA 49 packet library, extended to VITA 49.2, with a Zephyr module.
    - name: libvrt
      remote: cyber-murmel
      revision: 6ee1471079b969d843aa2f7dbc6ac74c086168a2 # esp-sdr branch
      path: modules/lib/libvrt
    # Upstream ESP-IDF firmware: only its header-only receiver helpers are used.
    - name: esp-sdr
      remote: espargos
      revision: 1fe55351036337359bcac1ccca6db04c32fde4f8
      path: modules/lib/esp-sdr
    # Espressif DSP library: only the ESP32-S3 FFT kernel (apps/link OFDM).
    - name: esp-dsp
      remote: espressif
      revision: 3c8ac0fdfec83740b783e200862c8d0c056de0ad
      path: modules/lib/esp-dsp
    # MicroPython as a Zephyr module: CONFIG_MICROPYTHON builds its Zephyr port as the
    # micropython library, which provides main() (apps/micropython). The mp-lvgl branch, as
    # cyber-murmel/mp-lvgl-example pins it (1.30.0-preview).
    - name: micropython
      remote: cyber-murmel
      revision: e4eb8522af3a1580273125641ec53a538d4e9491 # mp-lvgl branch
      path: modules/micropython
    # The frozen modules' library (argparse, upysh, ...), where the port expects it.
    - name: micropython-lib
      remote: micropython
      revision: ee4bb8ff139e24c42b739935fbd8ec7c4d061e02
      path: modules/micropython/lib/micropython-lib
    # LVGL at the revision Zephyr pins (listed here, not imported, so that it can be fetched on its
    # own), the binding for MicroPython adapted for Zephyr (cyber-murmel/mp-lvgl-example), and the
    # C parser its generator needs (the revision its own west.yml pins).
    - name: lvgl
      remote: zephyrproject-rtos
      revision: d1fe35d350a1503db2ec7fd4dfff8e0cc26eea7e
      path: modules/lib/gui/lvgl
    - name: lv_binding_micropython
      remote: cyber-murmel
      revision: ded0cd857fc8b813753facfbae011ac5e74961f6 # zsdr branch (mp-lvgl + two commits)
      path: modules/lib/gui/lv_binding_micropython
    - name: pycparser
      remote: eliben
      revision: 3cf6bf5eb16f5eadd4a058e41596145c407a79ad
      path: modules/lib/gui/lv_binding_micropython/pycparser
