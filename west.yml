manifest:
  self:
    path: esp-sdr-zephyr

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: cyber-murmel
      url-base: https://github.com/cyber-murmel
    - name: espargos
      url-base: https://github.com/ESPARGOS

  projects:
    # Zephyr with ESP32-S3 SMP (zephyrproject-rtos/zephyr#120082, rebased) and
    # the CDC-NCM NTB aggregation the USB stream relies on.
    - name: zephyr
      remote: cyber-murmel
      revision: esp32s3-smp
      import:
        name-allowlist:
          - mcuboot
          - mbedtls
          - tf-psa-crypto
    # The HAL companion of the SMP port; listed here so it overrides the
    # revision Zephyr's own manifest pins.
    - name: hal_espressif
      remote: cyber-murmel
      revision: esp32s3-smp
      path: modules/hal/espressif
      groups:
        - hal
    # VITA 49 packet library, extended to VITA 49.2, with a Zephyr module.
    - name: libvrt
      remote: cyber-murmel
      revision: zephyr
      path: modules/lib/libvrt
    # Upstream ESP-IDF firmware: only its header-only receiver helpers are used.
    - name: esp-sdr
      remote: espargos
      revision: 1fe55351036337359bcac1ccca6db04c32fde4f8
      path: modules/lib/esp-sdr
